# Indent with spaces only: a tab anywhere in this file makes GitHub reject the whole form.
name: Development Task
description: A scoped unit of implementation work for contributors (one deliverable, with optional sub-tasks).
title: "[TODO] "
labels: ["TODO TASK"]
assignees: [The3dVehicleguy]
projects: ["Coalition-of-Freeware-Developers/2"]
body:
  - type: markdown
    attributes:
      value: |
        A focused, implementable unit of work. Break it into sub-tasks and link related issues and pull requests with `#123`.

        > * Keep acceptance criteria testable: each should be something a reviewer can check.
        > * Work happens on `dev` or a branch cut from it; pull requests target `dev`.
        > * Writing this for an AI agent to pick up? The **Agent-Ready Task** form asks for what an agent needs.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Viewport: camera, selection, gizmo, node editing"
        - "Rendering: X-Plane 12 emulation, lighting, shadows, sky, water, weather"
        - "Editor UI: panels, menus, dialogs, docking, shortcuts"
        - "Airports: apt.dat, AIRPORTS panel, runways, taxiways, signs, airport lights"
        - "Projects: .edX / .sex files, saving, recovery, WorldEditor import / export"
        - "Scenery export: scenery packs, DSF, apt.dat, scenery_packs.ini"
        - "X-Plane library & assets: library scan, objects, forests, autogen, thumbnails"
        - "Facades: facade tool, FACADE EDITOR, .fac files"
        - "Roads, base terrain & water"
        - "Scenery Gateway: download, validation, upload"
        - "Startup, settings & file locations: Vulkan check, preferences, logs, caches"
        - "Core engine: memory, threading, logging, smart pointers, math"
        - "Build system, CI, tests, installer"
        - "Documentation & user manual"
        - "Not sure"
    validations:
      required: true

# Priority is set by maintainers with labels, not by the author.
#
#   - type: dropdown
#     id: priority
#     attributes:
#       label: Priority
#       options:
#         - P0 (Critical)
#         - P1 (High)
#         - P2 (Medium)
#         - P3 (Low)
#     validations:
#       required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Rationale, context and constraints. Include screenshots or log excerpts if helpful.
      placeholder: |
        What problem does this solve?
        Why is it needed now?
        Any constraints or non-goals?
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code and documents involved
      description: The files, classes, plans or reports this touches, so whoever picks it up knows where to start.
      placeholder: |
        - source/SceneryEditorX/xplane/xp_datarefs.cpp
        - source/Editor/panels/properties_panel.cpp (Animation section)
        - plan/feature-xp12-environment-rendering-1.md, phase 9

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable outcomes (the definition of done).
      placeholder: |
        - [ ] Changing a dataref on one placement only moves that placement
        - [ ] A Catch2 case in XPlaneFormatTests covers two placements of one animated .obj
        - [ ] Builds on Windows, Linux and macOS
    validations:
      required: true

  - type: textarea
    id: checklist_markdown
    attributes:
      label: Task checklist
      description: One `- [ ] ` per sub-task. `- [ ] Refactor foo (#123)` links another issue.
      placeholder: |
        - [ ] Store dataref values per placement
        - [ ] Update the PROPERTIES panel to edit the selected placement's values
        - [ ] Add unit tests
        - [ ] Update docs/manual if the behaviour changes
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How to verify
      description: Test suites to run, editor command lines that show the change, or manual steps. AGENTS.md lists the test suites and their build commands.
      render: shell
      placeholder: |
        ./build_linux_tests/XPlaneFormatTests "[obj8]"
        SceneryEditorX.exe --xp-airport KBOS --tools-selftest

  - type: checkboxes
    id: meta_flags
    attributes:
      label: Meta flags
      description: Mark anything that needs special handling.
      options:
        - label: Needs new or updated tests
        - label: Changes a public API
        - label: Changes a file format (.edX / .sex FORMAT_VERSION, or exported X-Plane files)
        - label: Platform-specific code (must be implemented for Windows, Linux and macOS)
        - label: Needs a benchmark or performance check
        - label: Needs a user manual or docs update

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Issues, pull requests or external work that must land first.
      placeholder: "Depends on #69 (deletion queue delay)."

  - type: textarea
    id: risks
    attributes:
      label: Risks / mitigations
      placeholder: |
        Risk: per-placement values add memory per instance at large airports.
        Mitigation: store only values that differ from the object's defaults.

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Other context, references, benchmarks or design links.
