<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 0 1256 720" width="1256" height="720" role="img" aria-labelledby="title desc">
  <title id="title">The Scenery Editor X workspace</title>
  <desc id="desc">The menu bar across the top; the tool strip on the far left; the PROPERTIES panel left of the viewport; the viewport with its toolbar in the middle; panels docked on the right and along the bottom; the panel strip on the far right; the status bar at the bottom.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6cc3ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14232f"/>
      <stop offset="1" stop-color="#0d1720"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4f6e"/>
      <stop offset=".55" stop-color="#6d93ad"/>
      <stop offset=".56" stop-color="#4f5a4c"/>
      <stop offset="1" stop-color="#3b4438"/>
    </linearGradient>
    <style>
      text { white-space: pre; font-family: "Segoe UI", "Open Sans", Helvetica, Arial, sans-serif; }
      .frame { fill: #1d2125; stroke: #8fcdf7; stroke-opacity: .55; stroke-width: 1.5; }
      .panel { fill: #232a31; stroke: #8fcdf7; stroke-opacity: .35; }
      .strip { fill: #1a1f24; stroke: #8fcdf7; stroke-opacity: .35; }
      .tab { fill: #e8eef3; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .tab-dim { fill: #8fa3b3; font-size: 12px; font-weight: 600; letter-spacing: .06em; }
      .sub { fill: #9fb2c1; font-size: 12.5px; }
      .label { fill: #ffffff; font-size: 15px; font-weight: 700; }
      .num { fill: #ffffff; font-size: 13px; font-weight: 800; text-anchor: middle; }
      .dot { fill: #1f8ad6; stroke: #0d1720; stroke-width: 3; }
      .line { stroke: #6cc3ff; stroke-opacity: .6; stroke-width: 1.4; fill: none; }
      .icon { fill: #6cc3ff; fill-opacity: .55; }
    </style>
  </defs>

  <rect x="-28" width="1256" height="720" fill="url(#bg)"/>
  <rect x="-28" width="1256" height="720" fill="url(#grid)"/>

  <!-- Window -->
  <rect x="40" y="36" width="1120" height="648" rx="10" class="frame"/>

  <!-- Menu bar -->
  <rect x="41" y="37" width="1118" height="30" rx="9" fill="#1e1e1e"/>
  <text x="62" y="57" class="sub" fill="#d8d8d8">File   Edit   Scene   X-Plane   Facade   Window   Viewport   Help</text>

  <!-- Tool strip (left) -->
  <rect x="41" y="67" width="36" height="589" class="strip"/>
  <g class="icon">
    <rect x="50" y="80" width="18" height="18" rx="4" fill="#1f8ad6" fill-opacity="1"/>
    <rect x="50" y="106" width="18" height="18" rx="4"/>
    <rect x="50" y="132" width="18" height="18" rx="4"/>
    <rect x="50" y="158" width="18" height="18" rx="4"/>
    <rect x="50" y="184" width="18" height="18" rx="4"/>
    <rect x="50" y="210" width="18" height="18" rx="4"/>
    <rect x="50" y="248" width="18" height="18" rx="9"/>
    <rect x="50" y="274" width="18" height="18" rx="9"/>
    <rect x="50" y="312" width="18" height="18" rx="2"/>
    <rect x="50" y="338" width="18" height="18" rx="2"/>
  </g>

  <!-- PROPERTIES (left) -->
  <rect x="77" y="67" width="190" height="589" class="panel"/>
  <text x="91" y="90" class="tab">PROPERTIES</text>
  <rect x="91" y="96" width="86" height="2" fill="#1f8ad6"/>
  <g fill="#8fcdf7" fill-opacity=".18">
    <rect x="91" y="116" width="162" height="10" rx="2"/><rect x="91" y="136" width="120" height="10" rx="2"/>
    <rect x="91" y="156" width="150" height="10" rx="2"/><rect x="91" y="186" width="162" height="10" rx="2"/>
    <rect x="91" y="206" width="100" height="10" rx="2"/><rect x="91" y="226" width="140" height="10" rx="2"/>
  </g>

  <!-- Viewport toolbar + viewport -->
  <rect x="267" y="67" width="634" height="30" fill="#262626" stroke="#8fcdf7" stroke-opacity=".35"/>
  <g class="icon">
    <rect x="279" y="74" width="16" height="16" rx="3" fill="#1f8ad6" fill-opacity="1"/><rect x="299" y="74" width="16" height="16" rx="3"/>
    <rect x="319" y="74" width="16" height="16" rx="3"/><rect x="339" y="74" width="16" height="16" rx="3"/>
    <rect x="359" y="74" width="16" height="16" rx="3"/><rect x="379" y="74" width="16" height="16" rx="3"/>
    <rect x="409" y="74" width="16" height="16" rx="8"/><rect x="429" y="74" width="16" height="16" rx="8"/>
    <rect x="459" y="74" width="16" height="16" rx="8"/><rect x="479" y="74" width="16" height="16" rx="8"/>
    <rect x="509" y="74" width="16" height="16" rx="3"/>
    <rect x="857" y="74" width="16" height="16" rx="3"/><rect x="877" y="74" width="16" height="16" rx="3"/>
  </g>
  <rect x="267" y="97" width="634" height="381" fill="url(#sky)" stroke="#8fcdf7" stroke-opacity=".35"/>
  <!-- runway in perspective -->
  <path d="M520 478 L600 312 L622 312 L700 478 Z" fill="#2c3136" stroke="#e8eef3" stroke-opacity=".5"/>
  <path d="M611 318 V470" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 9" stroke-opacity=".8"/>
  <rect x="440" y="372" width="56" height="34" fill="#9aa6ad" stroke="#d6dde2" stroke-opacity=".6"/>
  <path d="M436 372 L468 352 L500 372 Z" fill="#7f8b93"/>
  <rect x="745" y="390" width="40" height="22" fill="#b3bcc2"/>
  <text x="283" y="118" class="sub" fill="#e8eef3">Orbit  |  User Perspective  |  1600 x 900</text>

  <!-- Bottom panels -->
  <rect x="267" y="478" width="634" height="178" class="panel"/>
  <text x="281" y="501" class="tab">X-PLANE LIBRARY</text>
  <rect x="281" y="507" width="128" height="2" fill="#1f8ad6"/>
  <text x="425" y="501" class="tab-dim">AIRPORTS</text>
  <text x="511" y="501" class="tab-dim">ASSETS</text>
  <text x="583" y="501" class="tab-dim">CONSOLE</text>
  <g fill="#8fcdf7" fill-opacity=".16">
    <rect x="281" y="524" width="70" height="56" rx="4"/><rect x="359" y="524" width="70" height="56" rx="4"/>
    <rect x="437" y="524" width="70" height="56" rx="4"/><rect x="515" y="524" width="70" height="56" rx="4"/>
    <rect x="593" y="524" width="70" height="56" rx="4"/><rect x="671" y="524" width="70" height="56" rx="4"/>
    <rect x="749" y="524" width="70" height="56" rx="4"/><rect x="827" y="524" width="60" height="56" rx="4"/>
  </g>

  <!-- Right panels -->
  <rect x="901" y="67" width="222" height="200" class="panel"/>
  <text x="915" y="90" class="tab">OUTLINER</text>
  <rect x="915" y="96" width="78" height="2" fill="#1f8ad6"/>
  <text x="1009" y="90" class="tab-dim">PROJECT</text>
  <g fill="#8fcdf7" fill-opacity=".16">
    <rect x="915" y="114" width="150" height="9" rx="2"/><rect x="929" y="132" width="130" height="9" rx="2"/>
    <rect x="929" y="150" width="110" height="9" rx="2"/><rect x="915" y="168" width="140" height="9" rx="2"/>
  </g>
  <rect x="901" y="267" width="222" height="389" class="panel"/>
  <text x="915" y="290" class="tab">SCENE SETTINGS</text>
  <rect x="915" y="296" width="118" height="2" fill="#1f8ad6"/>
  <text x="915" y="314" class="tab-dim">CAMERA · RENDERER · FACADES</text>
  <text x="915" y="332" class="tab-dim">FACADE EDITOR · ENVIRONMENT</text>

  <!-- Panel strip (right) -->
  <rect x="1123" y="67" width="36" height="589" class="strip"/>
  <g class="icon">
    <rect x="1132" y="80" width="18" height="18" rx="4" fill="#1f8ad6" fill-opacity=".9"/><rect x="1132" y="106" width="18" height="18" rx="4" fill="#1f8ad6" fill-opacity=".9"/>
    <rect x="1132" y="132" width="18" height="18" rx="4"/><rect x="1132" y="158" width="18" height="18" rx="4"/>
    <rect x="1132" y="184" width="18" height="18" rx="4" fill="#1f8ad6" fill-opacity=".9"/><rect x="1132" y="210" width="18" height="18" rx="4"/>
    <rect x="1132" y="236" width="18" height="18" rx="4"/><rect x="1132" y="262" width="18" height="18" rx="4"/>
    <rect x="1132" y="288" width="18" height="18" rx="4"/><rect x="1132" y="314" width="18" height="18" rx="4"/>
  </g>

  <!-- Status bar -->
  <rect x="41" y="656" width="1118" height="27" rx="0" fill="#1e1e1e"/>
  <text x="56" y="674" class="sub">Ready</text>
  <text x="1144" y="674" class="sub" text-anchor="end">60 fps  |  16.6 ms  |  GPU 1840 MiB  |  Version: 0.2.28.529</text>

  <!-- Callouts -->
  <g>
    <circle cx="600" cy="20" r="13" class="dot"/><text x="600" y="24.5" class="num">1</text>
    <path d="M600 33 V45" class="line"/>
    <text x="620" y="25" class="label">Menu bar</text>

    <circle cx="20" cy="210" r="13" class="dot"/><text x="20" y="214.5" class="num">2</text>
    <path d="M33 210 H48" class="line"/>
    <text x="10" y="245" class="label" transform="rotate(-90 10 245)" text-anchor="end">Tool strip</text>

    <circle cx="172" cy="360" r="13" class="dot"/><text x="172" y="364.5" class="num">3</text>
    <text x="172" y="392" class="label" text-anchor="middle">PROPERTIES</text>

    <circle cx="586" cy="138" r="13" class="dot"/><text x="586" y="142.5" class="num">4</text>
    <text x="606" y="143" class="label">Viewport toolbar</text>
    <path d="M586 125 V93" class="line"/>

    <circle cx="380" cy="250" r="13" class="dot"/><text x="380" y="254.5" class="num">5</text>
    <text x="400" y="255" class="label">Viewport</text>

    <circle cx="1012" cy="210" r="13" class="dot"/><text x="1012" y="214.5" class="num">6</text>
    <text x="1012" y="240" class="label" text-anchor="middle">Docked panels</text>

    <circle cx="584" cy="615" r="13" class="dot"/><text x="584" y="619.5" class="num">7</text>
    <text x="604" y="620" class="label">Bottom panels</text>

    <circle cx="1180" cy="210" r="13" class="dot"/><text x="1180" y="214.5" class="num">8</text>
    <path d="M1167 210 H1152" class="line"/>
    <text x="1190" y="245" class="label" transform="rotate(90 1190 245)">Panel strip</text>

    <circle cx="600" cy="700" r="13" class="dot"/><text x="600" y="704.5" class="num">9</text>
    <path d="M600 687 V683" class="line"/>
    <text x="620" y="705" class="label">Status bar</text>
  </g>
</svg>
