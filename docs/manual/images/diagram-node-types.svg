<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Node types</title>
  <desc id="desc">Four nodes on a curve. Corner: no handles, the segments meet in a point. Smooth: two handles in a line, of different lengths. Symmetric: two handles in a line, of the same length. Free: two handles at an angle, making a cusp.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6cc3ff" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14232f"/><stop offset="1" stop-color="#0d1720"/>
    </linearGradient>
    <style>
      text { white-space: pre; font-family: "Segoe UI", "Open Sans", Helvetica, Arial, sans-serif; }
      .card { fill: #1b2833; stroke: #8fcdf7; stroke-opacity: .35; }
      .curve { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; }
      .handle { stroke: #6cc3ff; stroke-width: 1.6; }
      .grip { fill: #0d1720; stroke: #6cc3ff; stroke-width: 2; }
      .node-corner { fill: #1f8ad6; stroke: #ffffff; stroke-width: 2; }
      .node { fill: #1f8ad6; stroke: #ffffff; stroke-width: 2; }
      .name { fill: #ffffff; font-size: 20px; font-weight: 800; text-anchor: middle; }
      .key { fill: #0d1720; stroke: #6cc3ff; stroke-opacity: .7; }
      .keytext { fill: #e8eef3; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
      .desc { fill: #b8c6d1; font-size: 13.5px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- Corner -->
  <rect x="30" y="30" width="262" height="320" rx="14" class="card"/>
  <path d="M60 220 L161 120 L262 220" class="curve" stroke-linejoin="miter"/>
  <rect x="152" y="111" width="18" height="18" class="node-corner"/>
  <text x="161" y="270" class="name">Corner</text>
  <rect x="124" y="284" width="74" height="24" rx="5" class="key"/><text x="161" y="301" class="keytext">Shift+C</text>
  <text x="161" y="332" class="desc">No handles: a sharp point</text>

  <!-- Smooth -->
  <rect x="322" y="30" width="262" height="320" rx="14" class="card"/>
  <path d="M352 220 C 380 140, 420 120, 453 120 C 510 120, 560 160, 554 220" class="curve"/>
  <line x1="420" y1="120" x2="510" y2="120" class="handle"/>
  <circle cx="420" cy="120" r="6" class="grip"/><circle cx="510" cy="120" r="6" class="grip"/>
  <circle cx="453" cy="120" r="9" class="node"/>
  <text x="453" y="270" class="name">Smooth</text>
  <rect x="416" y="284" width="74" height="24" rx="5" class="key"/><text x="453" y="301" class="keytext">Shift+S</text>
  <text x="453" y="332" class="desc">In line, own lengths</text>

  <!-- Symmetric -->
  <rect x="614" y="30" width="262" height="320" rx="14" class="card"/>
  <path d="M644 220 C 670 140, 700 120, 745 120 C 790 120, 820 140, 846 220" class="curve"/>
  <line x1="700" y1="120" x2="790" y2="120" class="handle"/>
  <circle cx="700" cy="120" r="6" class="grip"/><circle cx="790" cy="120" r="6" class="grip"/>
  <circle cx="745" cy="120" r="9" class="node"/>
  <text x="745" y="270" class="name">Symmetric</text>
  <rect x="708" y="284" width="74" height="24" rx="5" class="key"/><text x="745" y="301" class="keytext">Shift+Y</text>
  <text x="745" y="332" class="desc">Mirror images: same length</text>

  <!-- Free -->
  <rect x="906" y="30" width="262" height="320" rx="14" class="card"/>
  <path d="M936 220 C 960 160, 990 140, 1037 120 C 1060 160, 1110 190, 1138 220" class="curve"/>
  <line x1="990" y1="140" x2="1037" y2="120" class="handle"/>
  <line x1="1037" y1="120" x2="1060" y2="160" class="handle"/>
  <circle cx="990" cy="140" r="6" class="grip"/><circle cx="1060" cy="160" r="6" class="grip"/>
  <circle cx="1037" cy="120" r="9" class="node"/>
  <text x="1037" y="270" class="name">Free</text>
  <rect x="1000" y="284" width="74" height="24" rx="5" class="key"/><text x="1037" y="301" class="keytext">Shift+F</text>
  <text x="1037" y="332" class="desc">Independent: a cusp</text>
</svg>
